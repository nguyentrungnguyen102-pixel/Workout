name: Telegram workout reminder

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_all_variants:
        description: 'Gửi thử cả 4 mẫu tin ngay (bỏ qua giờ/thứ/chống trùng)'
        required: false
        type: boolean
        default: false

# Chống chồng lấn: nếu 1 lần chạy bị treo mà chưa xong khi tick /30 phút kế
# tiếp tới, lần chạy mới sẽ CHỜ thay vì chạy song song — tránh 2 job cùng
# ghi lastReminderSent một lúc.
concurrency:
  group: telegram-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    # Backstop cứng: script tự thoát tường minh (process.exit) ngay khi xong
    # và mọi lệnh gọi mạng có timeout riêng, nhưng nếu vẫn treo vì lý do nào
    # khác thì job tự huỷ sau 5 phút thay vì chiếm slot hàng giờ.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard secrets
        id: guard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Reminder secrets not configured yet — skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.guard.outputs.ok == 'true'
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Send reminders
        if: steps.guard.outputs.ok == 'true'
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_ALL_VARIANTS: ${{ inputs.test_all_variants }}
        run: node telegram-reminder.mjs
